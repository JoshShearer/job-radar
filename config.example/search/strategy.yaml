combos:
  - name: Solutions engineering + production engineering
    all:
      - solutions engineer
      - typescript
    bonus: 20
    lane: solutions_eng
    why: Six years as Sales Engineer / Account Manager at Valin plus production TypeScript ownership. Pre-sales orgs usually get one or the other.
  - name: Solutions engineering + developer/API platform
    all:
      - solutions engineer
      - api
    bonus: 14
    lane: solutions_eng
    why: A technical seller whose demo is code, not slides. The product being an API is what makes the engineering half of the record load-bearing.
  - name: Pre-sales + AI product
    all:
      - pre-sales
      - llm
    bonus: 16
    lane: solutions_eng
    why: Quota-carrying technical sales history against a product category he has actually built with.
  - name: Customer-facing technical + industrial/data-center domain
    all:
      - solutions
      - data center
    bonus: 16
    lane: solutions_eng
    why: Valin's account base included data-center clients and ARES was controls and instrumentation. Server hardware and network operations are not abstractions here, which is unusual for an application engineer.
  - name: Payload CMS + Next.js
    all:
      - payload
      - next
    bonus: 22
    lane: full_stack
    why: Direct match for ShroomSpy production stack. Extremely rare combination.
  - name: Technical SEO + full-stack engineering
    all:
      - seo
      - typescript
    bonus: 20
    lane: growth_seo
    why: Engineer who can ship the SEO fix, not just file the ticket.
  - name: Programmatic SEO + TypeScript/Next
    all:
      - programmatic seo
      - next
    bonus: 22
    lane: growth_seo
    why: 35+ programmatic landing pages already built and measured.
  - name: SEO + marketplace/ecommerce
    all:
      - seo
      - marketplace
    bonus: 16
    lane: growth_seo
    why: ShroomSpy is a production SEO-driven marketplace.
  - name: React + Three.js + proptech
    all:
      - react
      - three
    bonus: 20
    lane: spatial_iot
    why: Lead Application Platform Developer on an AI 3D real-estate platform.
  - name: IoT + web platform
    all:
      - iot
      - typescript
    bonus: 18
    lane: spatial_iot
    why: LoopString connects TypeScript cloud apps to Linux edge devices.
  - name: MQTT + cloud application
    all:
      - mqtt
      - cloud
    bonus: 16
    lane: spatial_iot
    why: Directly built this, end to end.
  - name: Founding/startup ownership + senior IC
    all:
      - founding
      - senior
    bonus: 14
    lane: full_stack
    why: Founder experience with real production delivery, not just title.
  - name: LLM product + TypeScript
    all:
      - llm
      - typescript
    bonus: 16
    lane: ai_product
    why: AI-assisted product engineering in the actual stack, not ML research.
  - name: AI agents + product engineering
    all:
      - agent
      - product
    bonus: 14
    lane: ai_product
    why: Agent architecture with human-in-the-loop design.
  - name: Experimentation + engineering
    all:
      - experimentation
      - engineer
    bonus: 12
    lane: growth_seo
    why: 200+ measured SEO experiments.
