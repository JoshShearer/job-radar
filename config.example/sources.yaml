  - company: Shopify
    why: Marketplace + technical SEO at scale
  - company: Framer
    why: Design/web platform, no public ATS endpoint found
  - company: Statsig
    why: Experimentation platform - matches the 200+ experiments story
  - company: Clerk
    why: Dev platform, Next.js-native
  - company: Belong
