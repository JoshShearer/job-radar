scoring:
  # Raw signal points are divided by this then clamped to 0-100.
  # Lower divisor => easier to reach a high score.
  normalize_divisor: 1.6
  # Points awarded when the title itself matches a target_titles entry.
  title_match_bonus: 18
  # Multiplier on a signal's weight when it appears in the title.
  title_multiplier: 2.0
  # Recency: jobs older than this many days lose points.
  freshness_full_days: 7
  freshness_zero_days: 45
  freshness_max_points: 10

  # Age past which a posting is furniture rather than an opening. Excluded
  # from recommendations AND from paid analysis unless --include-evergreen.
  #
  # 180 is deliberately far out, and it was measured rather than picked. A
  # tight cutoff destroys the pool; a loose one costs almost nothing:
  #
  #     cutoff    apply-recommendations lost (of 8)
  #      30d       4      <- half the pool, including the best fit in the index
  #      90d       2
  #     180d       1      <- Hightouch Deployment Architect, 219 days old
  #
  # This is not the freshness control. Ranking handles freshness in the normal
  # range, and `analysis_fresh_*` below biases spend toward new postings. This
  # only catches the extreme, where something has been up for six months and is
  # almost certainly an always-on requisition.
  #
  # A posting with no published date is NEVER evergreen. Missing data is not
  # disqualifying data.
  evergreen_days: 180

  # Freshness-first spend. A posting newer than analysis_fresh_days gets
  # analysis_fresh_bonus added to its rank when `analyze` chooses what to buy.
  #
  # A nudge, not a sort key - same reasoning as analysis_diversity's bonuses. A
  # clearly better older posting should still win; what this stops is spending
  # the day's budget on four-month-old listings while this week's sit unread.
  # Median posting age at apply was 55 days, which is where that showed up.
  analysis_fresh_days: 21
  analysis_fresh_bonus: 12

  # Failed analysis attempts before a job stops being offered for paid
  # analysis. A malformed response was refused correctly and then forgotten,
  # so the job stayed eligible, got re-selected next pass, and was paid for
  # again - 10 failures on the books, roughly $0.46, recurring.
  #
  # 2, not 1: the observed failure rate is a steady 3-5% across days and runs
  # (3 of 100 on 08-14; 1, 2, 2 and 2 across four separate runs on 08-19), which
  # is the shape of an occasional bad response rather than a posting the model
  # cannot handle. One retry costs about $0.05 and is worth it; a third cannot
  # end differently if the failure is deterministic for that posting.
  #
  # API failures do not count against this - see countsAgainstJob. A dropped
  # connection is not evidence about the posting.
  #
  # The counter resets when the description changes, because that is a
  # different input and deserves fresh attempts.
  analysis_max_attempts: 2
  # Minimum RAW fit score to be eligible for LLM analysis (cost control).
  #
  # Lowered 55 -> 35 on 2026-08-19 against measured data, not intuition. Hit
  # rate by raw band, over 270 analyzed jobs - "hit" meaning the analyst came
  # back `apply` or `apply_and_outreach`:
  #
  #     raw 55+     81 analyzed   12 apply   14.8%
  #     raw 45-54   60 analyzed    6 apply   10.0%
  #     raw 35-44   77 analyzed    5 apply    6.5%
  #     raw 25-34   39 analyzed    1 apply    2.6%
  #
  # At 55 the two middle bands were never eligible, and they contain real
  # roles: Vercel Site Engineer (raw 54 -> fit 84, apply_and_outreach),
  # Hightouch Web Engineer (52 -> 72, apply), Twilio Applied Research (47 ->
  # 70, apply), Render Growth (36 -> 73, apply). Resend Product Engineer scored
  # raw 21 and came back a 72-fit apply, which is the clearest statement
  # available that this prefilter ranks better than it gates.
  #
  # 35 is where the rate is still meaningfully above the 25-34 band. Going
  # lower is defensible but costs roughly $0.04/job for a 2.6% hit rate.
  #
  # SPEND IS BOUNDED BY `--limit` AND `max_spend_per_run_usd`, NOT BY THIS
  # NUMBER. The threshold decides what is eligible; those two decide what gets
  # paid for. Raising it does not cut the bill - it changes which jobs the same
  # money is spent on.
  #
  # `analysis_threshold` USED TO LIVE HERE. It is gone on purpose - do not add
  # it back expecting it to do anything.
  #
  # It gated eligibility for paid analysis on an absolute keyword score, and
  # that score is not accurate enough to gate on. Mean absolute error against
  # the analyst is 26.6 points on a 0-100 scale, and measured over 406 analyzed
  # jobs the hit rate is not even monotonic through the middle of the range:
  #
  #     raw 90+      25 analyzed    8 apply   32.0%
  #     raw 75-89    13 analyzed    2 apply   15.4%
  #     raw 60-74    59 analyzed    4 apply    6.8%
  #     raw 50-59    77 analyzed    5 apply    6.5%
  #     raw 40-49    86 analyzed    7 apply    8.1%   <- beats both bands above
  #     raw 30-39    85 analyzed    3 apply    3.5%
  #
  # The rank is reliable even where the score is not, so `analyze` now takes
  # the top K by rank and the gate is retired. Spend is bounded directly by
  # `--limit` and `max_spend_per_run_usd` rather than by proxy, and eligibility
  # is bounded by the filters, which encode the constraints that are actually
  # real (salary floor, location, seniority).
  #
  # This also removes a failure mode that cost a real afternoon: with the gate
  # set above what the scorer could produce, `analyze` reported an exhausted
  # index while the index was full, and the response was to add 55 job boards
  # that were never the constraint.
  #
  # `--min-fit` still exists for one-off use. It is a deliberate human choice
  # for a single pass, not a standing default nobody re-derives.
  #
  # Minimum fit score to appear in the daily report at all.
  report_threshold: 45

  # Hard ceiling on one `analyze` pass, in USD. The pass stops before the call
  # that would cross it and says where it stopped; run again to continue.
  #
  # There was no ceiling until 2026-08-19. `--limit` bounded the job count and
  # nothing bounded the money, so three routine passes in one afternoon came to
  # $4.30 and a fortnight came to $19.54, with the first real feedback arriving
  # on a credit-card statement. Override per run with `--max-spend`.
  max_spend_per_run_usd: 1.50

# Reading application mail, so the funnel has real outcomes in it.
#
# The tracker showed 43 applications and zero results - not because nothing
# happened, but because nothing wrote it down. SCREEN, REJECTED and GHOSTED all
# sat at zero, so every score in the system was a guess never checked against
# reality.
#
# READ-ONLY. This reads mail and never sends, replies, labels or deletes.
# Credentials come from the environment, not from here:
#   JOB_RADAR_GMAIL_CLIENT_ID / _CLIENT_SECRET / _REFRESH_TOKEN
# with the gmail.readonly scope.
inbox:
  # Scoped to the ATS platforms the tool already ingests from, plus anything
  # you have labelled. Narrow on purpose: a scan that reads the whole mailbox
  # would be slower, more invasive, and no more accurate.
  gmail_query: >-
    (from:greenhouse.io OR from:hire.lever.co OR from:ashbyhq.com OR
     from:myworkdayjobs.com OR from:smartrecruiters.com OR from:workable.com OR
     label:job-applications)
  # A directory of .eml files, used when Gmail credentials are absent. Lets you
  # see what the classifier would do to real mail before pointing it at a live
  # mailbox.
  eml_dir: null
  scan_limit: 100

  # GHOSTED is the absence of email, so no parser can produce it. This is a
  # sweep over elapsed time, folded into the daily pass.
  #
  # 30 days is chosen to be later than almost every real reply. The cost of
  # being early is calling a live application dead; the cost of being late is a
  # row that says APPLIED for another fortnight.
  #
  # Silence is measured from the last CONTACT, not from the application, so a
  # job mid-conversation is never ghosted for having been applied to a while
  # ago.
  ghost_after_days: 30
  ghost_from: [APPLIED, CONTACTED]

# Two-tier analysis.
#
# 77% of paid analyses end in "skip" (314 of 406), and the output schema forced
# a full ~3KB dossier for every one - up to 8 strengths, 8 risks, 8 missing
# requirements, salary reasoning, outreach targets. Output tokens are ~70% of
# the bill and analyze is 84% of logged spend.
#
# Measured over the 406 stored analyses, the six triage fields are 25.9% of the
# output bytes. So roughly three quarters of what is being paid for on a skip
# is prose nobody reads.
#
# The second call is cheap on input because the system prefix is prompt-cached,
# so splitting costs very little for the jobs that do earn a dossier.
analysis_detail:
  # OFF, and this is now a measured result rather than a precaution.
  #
  # `benchmark-triage --limit 25` on 2026-08-20, Opus, balanced sample of 12
  # apply and 13 non-apply baselines:
  #
  #     apply-vs-not agreement   17/21 = 81.0%   (bar: 92%)
  #     mean absolute fit delta  6.2 points, almost all upward
  #     missed applies           0
  #     invented applies         4
  #
  # FAILS the gate, and the shape of the failure is the interesting part. The
  # triage form lost nothing - every apply baseline survived - but it PROMOTED
  # four network_or_watch roles to apply:
  #
  #     Sanity    Solutions Engineer, PreSales   network_or_watch -> apply_and_outreach
  #     Samsara   Staff Software Engineer        network_or_watch -> apply
  #     Hightouch Full Stack Product Engineer    network_or_watch -> apply
  #     Deepgram  Pre-Sales Solutions Engineer   network_or_watch -> apply
  #
  # That is the hypothesis in JOB-31's critique note, confirmed: the dossier's
  # forced risks and missingRequirements fields are doing real reasoning work.
  # A model made to write down why not applying is reasonable reaches a more
  # conservative verdict than one that is not asked. Remove the scaffolding and
  # it turns borderline roles into recommendations.
  #
  # With no outcome data yet (JOB-26) that regression would have been invisible
  # for months, which is exactly why the gate exists.
  #
  # WORTH TRYING NEXT, and untested because the API budget ran out mid-run:
  # add `missingRequirements` alone back into TRIAGE_FIELDS. It is the cheapest
  # of the three list fields and the most likely to be carrying the caution.
  # Re-run `benchmark-triage` before flipping this.
  #
  # A first run scored 96% and was wrong: the sampler returned apply baselines
  # only, so "invented applies: 0" meant nothing had been tested rather than
  # nothing had gone wrong. The sampler is balanced now.
  two_stage: false
  # Verdicts that always earn the dossier. Anything a human might act on.
  dossier_for: [apply_and_outreach, apply, network_or_watch]
  # ...and a safety valve. A `skip` at fit 70+ is more likely a model that has
  # misjudged something than a hopeless role, and the dossier is what a person
  # would need to tell which. Costs a handful of extra calls.
  dossier_min_fit: 70

# When a sweep may conclude a posting has left its board and park it.
#
# 339 filter-passing jobs were sitting at NEW although their board had stopped
# listing them. `top` flagged them [CLOSED?] and nothing acted on it, so they
# held ranking slots and could eat analysis budget.
#
# Both numbers exist to tell one thing apart from another: a board where lots of
# postings genuinely closed, versus a board that returned a truncated list. They
# look identical from here.
parking:
  # `isStale` uses a six-hour window, which is right for COLOURING a listing -
  # the cost of being wrong is one misleading tag. This is a STATE CHANGE, so
  # it waits far longer. At six hours a single bad response parks everything
  # that response omitted; at three days it takes a sustained failure.
  #
  # Measured on the live index: 354 NEW+passing jobs have a gap over 1 day, 329
  # over 3 days, 256 over 7. Nothing exceeds 14, because the index is only about
  # two weeks old.
  after_days: 3
  # If more than this share of a source's parkable jobs would go in one run,
  # the source is the problem and parking is refused for it entirely, loudly.
  # Same principle the ingest path already holds to: one failing source must
  # never invalidate a run.
  #
  # 0.8, not 0.5, and the difference was measured. Real per-source rates on the
  # current index:
  #
  #     greenhouse   1955 / 7563   25.8%
  #     lever          48 /  345   13.9%
  #     ashby         121 / 4082    3.0%
  #     remoteok      132 /  264   50.0%
  #
  # RemoteOK sits exactly on 0.5 because its feed is a rolling window - older
  # postings fall out permanently by design, so half its catalogue turning over
  # is normal operation, not a fault. A ceiling of 0.5 would have sat on that
  # knife edge and flapped between parking and refusing from run to run.
  #
  # 0.8 still catches what this is for: a board that returns a tenth of its
  # list leaves 90% looking absent, which trips it immediately.
  max_fraction_per_source: 0.8

roi:
  # Weights for the Application ROI composite. They should sum to ~1.0.
  weights:
    fit: 0.34
    differentiation: 0.20
    compensation: 0.16
    competition: 0.15
    recency: 0.10
    reachability: 0.05
  # Company-size proxy for competition. Smaller => less competition => better.
  # These are matched against detected company signals; unknown => neutral.
  competition:
    big_tech_penalty: 25
    unknown_company_neutral: 55
    small_company_bonus: 20

report:
  # Cap the actionable list so the daily briefing stays usable.
  max_priority_a: 3
  max_priority_b: 7
  max_priority_c: 5
  max_total: 12

# How the analysis budget is spread across companies.
#
# Added 2026-08-19 against measured data, not intuition. Of the first 362
# analyses, 175 went to 15 companies. ClickUp took 16 and Cresta 14, both for
# zero `apply` results, while 245 companies with filter-passing jobs had never
# had a single job analyzed.
#
# The old code did have a per-company cap of 2 - and then backfilled any unspent
# budget with no cap at all, so a narrow eligible pool silently removed the
# limit entirely. ClickUp took 3 in a single minute on 2026-08-19.
analysis_diversity:
  # Per company, per pass, before backfill.
  per_company_cap: 2
  # Hard ceiling once backfill starts. The old behaviour was effectively
  # unlimited; this is what stops one employer eating a whole run.
  per_company_backfill_cap: 3
  # A company that has spent this many analyses and never once come back
  # `apply` ranks behind unexplored companies. Deprioritised, never excluded -
  # its next posting could be the one that fits.
  cold_after: 6
  # These nudge the ranking rather than replacing it. A hard "unexplored first"
  # rule would put a ROI-5 unknown ahead of a ROI-70 Vercel role, which is worse
  # than the problem it fixes. At 8 points, exploration wins the near-ties and
  # loses to a genuinely better posting.
  unexplored_bonus: 8
  cold_penalty: 15
