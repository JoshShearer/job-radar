# Job Radar - career profile
#
# This file drives filtering, scoring, and compensation classification.
# Change your search strategy here; do not edit application code.
# Every field is validated on load (src/config/schema.ts) - a typo fails loudly.

identity:
  name: Josh Shearer
  headline: Senior full-stack engineer (TypeScript/React/Next.js/Node) with deep technical SEO and growth engineering experience
  years_experience: 10

compensation:
  currency: USD
  # Primary target band for base salary.
  target_min: 160000
  target_max: 180000
  # Below this we start down-ranking hard.
  acceptable_min: 145000
  # Absolute floor: a posted max below this is a hard reject.
  reject_below_max: 135000
  # Stretch band - roles credibly reaching here get a bonus.
  stretch_min: 190000
  stretch_max: 220000
  # Contract fallback, hourly.
  contract_min_hourly: 85
  contract_max_hourly: 110
  prefer_employment_type: full_time # full_time | contract | either

location:
  home_metro: Austin, TX
  remote_ok: true
  hybrid_metros: # hybrid acceptable only in these metros
    - Austin
    - Austin, TX
    - Austin, Texas
  onsite_ok_metros: # onsite acceptable only in these metros
    - Austin
    - Austin, TX
    - Austin, Texas
  relocation_ok: false
  # Country/region restrictions we cannot satisfy. Matching text => hard reject.
  work_authorization_blockers:
    - security clearance
    - ts/sci
    - top secret
    - polygraph
    - must be a us citizen
    - us citizenship required
    - citizenship is required
    - eu work authorization required
    - must reside in the uk
    - must be located in canada

# Lane weights express how much of the daily slate each lane should win.
# They are applied as a multiplier on the lane's raw fit score.
lanes:
  full_stack:
    label: Senior Full-Stack / Platform
    weight: 0.35
  growth_seo:
    label: Growth Engineering / Technical SEO
    weight: 0.30
  ai_product:
    label: AI-enabled Product Engineering
    weight: 0.25
  spatial_iot:
    label: Proptech / 3D / IoT
    weight: 0.10

seniority:
  # Titles at or above these are acceptable.
  accept:
    - senior
    - staff
    - lead
    - principal
    - founding
    - architect
    - head of
    - director
  # Junior signals - hard down-rank unless strategically interesting.
  reject:
    - intern
    - internship
    - junior
    - jr.
    - entry level
    - entry-level
    - new grad
    - graduate program
    - apprentice
    - associate engineer
    - i (entry
    - level 1

