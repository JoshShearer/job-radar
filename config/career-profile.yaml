# Combination bonuses. All `all` terms must be present. This is where the
# unusual-differentiation edge lives - it is the whole point of the system.
combos:
  - name: Solutions engineering + production engineering
    all: [solutions engineer, typescript]
    bonus: 20
    lane: solutions_eng
    why: Six years as Sales Engineer / Account Manager at Valin plus production
      TypeScript ownership. Pre-sales orgs usually get one or the other.
  - name: Solutions engineering + developer/API platform
    all: [solutions engineer, api]
    bonus: 14
    lane: solutions_eng
    why: A technical seller whose demo is code, not slides. The product being an
      API is what makes the engineering half of the record load-bearing.
  - name: Pre-sales + AI product
    all: [pre-sales, llm]
    bonus: 16
    lane: solutions_eng
    why: Quota-carrying technical sales history against a product category he has
      actually built with.
  - name: Customer-facing technical + industrial/data-center domain
    all: [solutions, data center]
    bonus: 16
    lane: solutions_eng
    why: Valin's account base included data-center clients and ARES was controls
      and instrumentation. Server hardware and network operations are not
      abstractions here, which is unusual for an application engineer.
