  # ---- RemoteOK ---------------------------------------------------------
  # Public JSON feed: https://remoteok.com/api
  # ATTRIBUTION REQUIRED by their API terms: any surface that displays these
  # listings must link back to https://remoteok.com with a followed link and
  # name Remote OK as the source. The generated report does this automatically
  # (src/report/daily.ts). If you remove that attribution, disable this source.
  remoteok:
    enabled: true

# Companies worth watching that have no public feed on any of the three ATS
# platforms above, or that you want to reach through a human rather than an
# application form. `job-radar daily` surfaces these as reminders; nothing is
# scraped for them.
watchlist:
  - { company: Payload, why: "Payload CMS core team - the exact stack, and they are small" }
  - { company: Ahrefs, why: "SEO platform; engineering IS the SEO work. No public ATS found." }
  - { company: Semrush, why: "Same. Check their careers page directly." }
  - { company: Botify, why: "Enterprise technical SEO platform - unusually on-lane" }
  - { company: Screaming Frog, why: "Crawler tooling; tiny team, direct outreach only" }
  - { company: Matterport, why: "3D/spatial + proptech, direct prior experience" }
  - { company: Shopify, why: "Marketplace + technical SEO at scale" }
  - { company: Framer, why: "Design/web platform, no public ATS endpoint found" }
  - { company: Statsig, why: "Experimentation platform - matches the 200+ experiments story" }
  - { company: Clerk, why: "Dev platform, Next.js-native" }
  - { company: Belong, why: "Proptech / smart building. Lever board 404'd on 2026-08-13; discover found nothing on Greenhouse/Lever/Ashby. Workable and SmartRecruiters not checked." }
